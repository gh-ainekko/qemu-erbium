name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write # tag releases upload assets to GitHub Releases
    steps:
      - uses: actions/checkout@v4

      - name: Preflight regression tests
        run: python3 tests/test_preflight.py

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ca-certificates build-essential git curl patch xz-utils libc6-dev-arm64-cross ninja-build meson pkg-config flex bison python3-venv python3-pip ccache \
            libglib2.0-dev libpixman-1-dev libfdt-dev libslirp-dev zlib1g-dev libgcrypt20-dev \
            cmake libgoogle-glog-dev liblz4-dev lz4 \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf \
            gcc-aarch64-linux-gnu libssl-dev libelf-dev bc cpio kmod dwarves device-tree-compiler

      - name: Offline ELF loader and source-update tests
        run: |
          python3 -m unittest discover -s tests -p 'test_erbctl_loader.py'
          python3 -m unittest discover -s tests -p 'test_fetch_sources.py'

      - name: ccache
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('qemu-patches/*', 'sysemu-patches/*', 'linux/patches/*', 'scripts/fetch-sources.sh') }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Check build dependencies
        run: scripts/preflight.sh deps

      - name: Fetch sources and apply patches
        run: scripts/fetch-sources.sh

      - name: Linux configuration regression test
        run: python3 tests/test_linux_config.py

      - name: Build QEMU (erbium-xspi)
        run: scripts/build-all.sh qemu

      - name: Build erbium_emu (sw-sysemu backend)
        run: scripts/build-all.sh sysemu

      - name: CPU reset and host-start regression tests
        run: python3 et-platform/sw-sysemu/tests/erbium/host/test_cpu_reset.py --emu build/sw-sysemu/erbium_emu

      - name: Build minion firmware
        run: scripts/build-all.sh firmware

      - name: Build Linux guest (kernel + initramfs + erbctl)
        run: scripts/build-all.sh linux

      - name: ccache stats
        run: ccache -s || true

      - name: End-to-end test (qtests + Linux guest against erbium_emu)
        run: scripts/run-e2e.sh 2>&1 | tee build/e2e.log

      - name: Package
        run: |
          V=${GITHUB_REF_NAME//\//-}
          scripts/package-dist.sh "$V"

      - name: Test packaged binaries in pristine Ubuntu
        run: scripts/test-dist-docker.sh out/*.tar.gz 2>&1 | tee build/runtime.log

      - uses: actions/upload-artifact@v4
        with:
          name: erbium-emu-dist
          path: |
            out/*.tar.gz
            out/*.tar.gz.sha256
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build/e2e.log
            build/runtime.log
            build/qemu-configure.log
            /tmp/erbium_emu.log
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.tar.gz
            out/*.tar.gz.sha256
          generate_release_notes: true
